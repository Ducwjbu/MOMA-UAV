# ============================================================
# Thesis pilot B1: ma3_prior with one omega per UAV (MOMA_CTDE_Agent omega_per_agent)
# Question: do UAVs given different omegas behave differently (roles), without losing the team front?
# ============================================================

# Environment
env_config: "config/environment/ma3.yaml"

# Training
total_training_steps: 300000       # pilot: compare with the ma3_prior learning curve at the same step
min_buffer_size: 5000
train_frequency: 1
train_iterations: 1
batch_size: 256
max_steps_per_episode: 18     # min on station at T_L = 60 s: the longest mission that, in the worst case (hovering at full power, farthest point), still leaves the energy to fly home (return_home)

# Omega sampling
omega_sampling: "random"
corner_warmup_episodes: 0

# Formation prior: each UAV flies to its vertex of the r-triangle at the top altitude, and the actor learns a
# residual on that movement. r = 600 m is within 0.4% of the 3-means coverage placement of the area
formation_prior: true
prior_radius: 600.0

# TD3 hyperparameters
actor_lr: 3.0e-4
critic_lr: 3.0e-4
gamma: 0.9                    # The effect of an action fades within about 2 steps (a UAV reaches any point of the area in 2 steps, queues are per step); chosen a priori, see CLAUDE.md (formation prior, why gamma 0.9)
tau: 0.005
policy_delay: 2
policy_noise: 0.2
noise_clip: 0.5
expl_noise: 0.3
expl_noise_min: 0.05
expl_noise_decay: 0.9999

# Replay buffer
buffer_size: 500000

# Logging & saving
log_interval: 5000
save_interval: 100000
eval_interval: 50000
eval_n_omega: 30
eval_n_episodes: 3
eval_steps: 18

# Output
save_dir: "saved_models_moma_ac_ma3_prior_pa"

# One omega per UAV: half the episodes draw an independent Dirichlet omega per UAV, the others one shared omega.
# omega also changes within an episode with probability 0.02 per step (about one episode in three)
omega_per_agent: 0.5
omega_switch_prob: 0.02
