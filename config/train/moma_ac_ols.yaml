# ============================================================
# MOMA-AC Training Config — OLS omega sampling
# omega ~ support M, grown at corner weights with the largest optimistic gap.
# Actions come from the plain actor; no critic estimate picks actions or weights.
# ============================================================

# Training
total_training_steps: 1000000
min_buffer_size: 5000
train_frequency: 1
train_iterations: 1
batch_size: 256
max_steps_per_episode: 19     # min on station at T_L = 60 s: the longest mission that, in the worst case (hovering at full power, farthest point), still leaves the energy to fly home (return_home)

# Omega sampling
omega_sampling: "ols"
gpi_ls_interval: 50000        # env steps between OLS iterations
gpi_ls_episodes: 3            # eval episodes per weight in an iteration
gpi_top_k: 2                  # corner weights added per iteration
gpi_max_support: 20           # cap on |M|
gpi_max_corners: 20           # corner weights ranked per iteration

# TD3 hyperparameters
actor_lr: 3.0e-4
critic_lr: 3.0e-4
gamma: 0.99
tau: 0.005
policy_delay: 2
policy_noise: 0.2
noise_clip: 0.5
expl_noise: 0.3
expl_noise_min: 0.05
expl_noise_decay: 0.9999

# Replay buffer
buffer_size: 500000

# Logging & saving
log_interval: 5000
save_interval: 100000
eval_interval: 50000
eval_n_omega: 30
eval_n_episodes: 3
eval_steps: 19

# Output
save_dir: "saved_models_moma_ac_ols"
