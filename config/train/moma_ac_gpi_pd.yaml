# ============================================================
# MOMA-AC Training Config — GPI-PD (GPI-LS + GPI-prioritized Dyna)
# Adds GPI-prioritized replay and a learned dynamics model to GPI-LS
# ============================================================

# Training
total_training_steps: 1000000
min_buffer_size: 5000
train_frequency: 1
train_iterations: 1
batch_size: 256
max_steps_per_episode: 60     # 1 hour of flight at T_L = 60 s, about one battery

# Omega sampling
omega_sampling: "gpi_pd"
gpi_ls_interval: 50000        # env steps between GPI-LS iterations
gpi_ls_episodes: 3            # eval episodes per weight in an iteration
gpi_top_k: 2                  # corner weights added per iteration
gpi_max_support: 20           # cap on |M|; GPI action cost grows with |M|^2
gpi_max_corners: 20           # corner weights evaluated per iteration

# Prioritized replay (Eq. 17)
per_alpha: 0.6
per_kappa: 0.1

# Dyna
dyna_interval: 250            # env steps between model fits
dyna_rollouts: 2000           # simulated transitions per fit (paper: 25k-50k, but this runs on CPU budgets)
dyna_beta: 0.5                # share of simulated transitions in a batch
model_fit_steps: 200          # max gradient steps per fit (early stopping on a holdout)
model_buffer_size: 100000

# TD3 hyperparameters
actor_lr: 3.0e-4
critic_lr: 3.0e-4
gamma: 0.99
tau: 0.005
policy_delay: 2
policy_noise: 0.2
noise_clip: 0.5
expl_noise: 0.3
expl_noise_min: 0.05
expl_noise_decay: 0.9999

# Replay buffer
buffer_size: 500000

# Logging & saving
log_interval: 5000
save_interval: 100000
eval_interval: 50000
eval_n_omega: 30
eval_n_episodes: 3
eval_steps: 60

# Output
save_dir: "saved_models_moma_ac_gpi_pd"
